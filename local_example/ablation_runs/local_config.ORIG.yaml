shared:
  pipeline_batch_size: 0   # 0 = no batching; process everything at once

data:
  chunk_size: 128
  chunk_overlap: 16
  file_extns:
    - "txt"
  # Small-to-big retrieval: build a parent store so a matched child chunk can be
  # expanded to its parent context. Requires ingest (use_existing_vector_db is
  # false below, so the corpus is re-ingested and the parent store is built).
  chunking_strategy: parent_child
  children_per_parent: 4

embedding:
  # Small HuggingFace embedding model that runs on CPU
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_model_platform: huggingface
  embedding_model_platform_args:
    hf_tokenizer_params:
      truncation: true
      padding: true
  pooling_strategy: mean
  normalize_embeddings: false   # upstream normalize_embedding() has a kwargs bug; skip it
  normalization_params: {'p': 2, 'dim': 1, 'eps': 1e-12}
  embedding_batch_size: 32

vector_db:
  db_type: faiss
  params: {gpu: False}
  similarity_threshold: 0.95
  similarity_fn: cosine
  faiss_index_type: IndexFlatL2
  use_existing_vector_db: false
  save_index: true
  num_gpus: 0
  vector_db_index_save_path: local_example/vector_db_index/index.idx
  metadata_index_save_path: local_example/vector_db_metadata/metadata.json
  vector_db_index_load_path: local_example/vector_db_index/index.idx
  metadata_index_load_path: local_example/vector_db_metadata/metadata.json

retriever:
  retriever_top_k: 5
  # Cross-encoder reranker ON. The rerank stage of both hybrid retrieve() and the
  # agentic retrieve_fused() is gated on a live reranker; without it that stage
  # silently no-ops. bge-reranker-base is a real cross-encoder (relevance head)
  # and lighter than -large for CPU. NOTE: bge-large-en is an EMBEDDING model with
  # no reranker head and must not be used here.
  use_reranker: true
  reranker_top_k: 5
  reranker_model_name: BAAI/bge-reranker-base
  reranker_model_platform: huggingface
  reranker_batch_size: 8
  num_gpus: 0
  # Hybrid + hierarchical retrieval (all default OFF in the framework).
  # use_hybrid adds a BM25 sparse signal fused with dense via RRF.
  use_hybrid: true
  use_rrf: true
  rrf_k: 60
  dense_weight: 1.0
  sparse_weight: 1.0
  # MMR diversity pass after reranking (helps multi-hop pull from distinct docs).
  use_mmr: true
  mmr_lambda: 0.5
  # Neighbor-window expansion (+/- N adjacent chunks) on top of parent expansion.
  chunk_read: 1

agent:
  # Global fused multi-query retrieval for the agentic path: instead of
  # concatenating per-subquery results, MultiQueryRetrieveTool runs one global
  # pipeline (raw candidates -> single RRF -> one cross-encoder rerank against the
  # original query -> one MMR -> top-k -> parent/neighbor expansion). Reuses the
  # retriever's rrf_k / weights / use_mmr / chunk_read / parent store above.
  use_fused_retrieval: true

generator:
  # Generator via AWS Bedrock (Claude Haiku 4.5) for meaningful answers.
  # Active Bedrock Claude models require the "us." inference-profile prefix.
  # For a no-credentials run, swap this block for a local HuggingFace generator
  # (e.g. sshleifer/tiny-gpt2 with platform huggingface).
  generator_model_name: us.anthropic.claude-haiku-4-5-20251001-v1:0
  generator_model_platform: bedrock
  num_gpus: 0
  generator_model_platform_args:
    bedrock_aws_region: us-west-2
    bedrock_generate_params:
      max_tokens: 1024
      anthropic_version: "bedrock-2023-05-31"
  # Terse-answer prefix mirrors the original Google NQ evaluation setup so
  # answers are short enough for exact-match scoring.
  generator_query_prefix: >
    You will be answering questions based on Wikipedia articles. Your response
    must contain only the actual answer itself and no extra information or words.
    Provide just the answer instead of forming full sentences. Your answer may
    even be a singular word or number. For example, if the query is "what
    percentage of the earth's surface is water?", your response must simply be
    'roughly 78%', or '78%'.
