RETRIEVER_TOP_K: 50
RERANKER_TOP_K: 10
RERANKER_MODEL: BAAI/bge-reranker-large
DEFAULT_RERANKER_MODEL_PLATFORM: huggingface
RERANKER_BATCH_SIZE: 64
USE_RERANKER: false

# Hybrid + hierarchical retrieval. All default OFF so the legacy dense-only path
# is unchanged unless a config opts in.
# USE_HYBRID adds a BM25 sparse signal alongside the dense retriever; results are
# fused with Reciprocal Rank Fusion (RRF). USE_RRF also enables RRF fusion for the
# agentic multi-query path. RRF_K is the RRF constant; DENSE_WEIGHT/SPARSE_WEIGHT
# weight each ranked list. USE_MMR applies Maximal Marginal Relevance for
# diversity after reranking (MMR_LAMBDA trades relevance vs. diversity).
# CHUNK_READ expands each retrieved child chunk by +/- N neighbor chunks (and to
# its parent chunk when a parent store is present). BM25_K1/BM25_B are the BM25
# term-saturation and length-normalization parameters.
USE_HYBRID: false
USE_RRF: false
RRF_K: 60
DENSE_WEIGHT: 1.0
SPARSE_WEIGHT: 1.0
USE_MMR: false
MMR_LAMBDA: 0.5
CHUNK_READ: 0
BM25_K1: 1.5
BM25_B: 0.75
