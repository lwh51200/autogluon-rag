# Default configuration for the optional Agentic RAG path.
# The agentic path is OFF by default; the standard RAG path remains the default
# behavior of generate_response(query). Agentic behavior runs only when enabled
# here or when generate_response is called with mode="agentic".
AGENT_ENABLED: false
AGENT_DEFAULT_MODE: standard
AGENT_MAX_ITERATIONS: 5
AGENT_MAX_SUBQUERIES: 4
AGENT_RETRIEVE_TOP_K_PER_QUERY: 8
AGENT_MAX_CONTEXT_TOKENS: 6000
AGENT_USE_QUERY_REWRITE: true
AGENT_USE_CONTEXT_COMPRESSION: false
AGENT_USE_VERIFICATION: true
AGENT_MIN_EVIDENCE_COUNT: 2
AGENT_RETURN_TRACE: false
# When true, MultiQueryRetrieveTool runs one genuinely global multi-query
# pipeline instead of concatenating per-subquery results: it collects raw dense
# (and, when retriever.USE_HYBRID is on, sparse) candidates for every subquery
# with no per-query reranking/MMR/expansion/truncation, runs a single RRF across
# all (subquery x signal) ranked lists, dedups by chunk identity while preserving
# every retrieval_query and source_signal, runs the cross-encoder exactly once
# against the original user query, applies MMR once (when retriever.USE_MMR),
# selects the final top-k, and only then expands parent/neighbor context. It
# reuses RRF_K and the fusion/MMR/expansion settings from the retriever config.
# Off by default so the standard agentic behavior (and its evidence counts) is
# unchanged.
AGENT_USE_FUSED_RETRIEVAL: false
